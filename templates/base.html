{% load static %}
{% load django_bootstrap5 %}

<!DOCTYPE html>
<html lang="en">

<head>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-E09TYZS7C5"></script>
  <script nonce="{{ csp_nonce }}">
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-E09TYZS7C5');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- default meta tags -->
  <meta name="description" content="{% block meta_description %}Maker-Stack: a community for hardware makers to share projects, build bills of materials, and track components.{% endblock %}">
  <meta name="keywords" content="{% block meta_keywords %}maker, hardware, electronics, arduino, raspberry pi, DIY, components {% endblock %}">
  
  <!-- Open Graph (for social sharing) -->
  <meta property="og:title" content="{% block og_title %}Maker-Stack{% endblock %}">
  <meta property="og:description" content="{% block og_description %}A community for hardware makers to share projects and track components.{% endblock %}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ request.build_absolute_uri }}">
  
  <meta property="og:image" content="{% block og_image %}{% endblock %}">
  



  <link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}">
  <title>{% block title %}{% endblock %} Maker-Stack</title>

  {% bootstrap_css %}
  {% bootstrap_javascript %}

  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <link rel="stylesheet" href="{% static 'fontawesome/css/all.min.css' %}">

  <script nonce="{{ csp_nonce }}">
    const saved = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', saved);
  </script>
</head>

<body>

  <header class="py-3">
    <div class="container-fluid px-4 d-flex align-items-center justify-content-between flex-wrap gap-2">
      <h1 class="mb-0">Maker-Stack <sub><span class="badge beta-badge">BETA</span></sub></h1>
      <div class="d-flex align-items-center gap-3">
        {% include 'navbar.html' %}
        <button id="theme-toggle" aria-label="Toggle theme">
          <i class="fa-solid fa-moon" id="theme-icon"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="py-4">
    {% block content %}{% endblock %}
  </main>

  <script nonce="{{ csp_nonce }}">
    const toggle = document.getElementById('theme-toggle');
    const icon = document.getElementById('theme-icon');

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
      icon.className = theme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
    }

    applyTheme(localStorage.getItem('theme') || 'light');

    toggle.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      applyTheme(current === 'dark' ? 'light' : 'dark');
    });
  </script>

</body>

</html>
