{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="container">
<form method="post">
    <h2>Add Build Step for "{{ project.title }}"</h2>
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-sm btn-outline-secondary">Add</button>
</form>
</div>
{% endblock %}
