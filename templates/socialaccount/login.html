{% extends "base.html" %}
{% load socialaccount %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4 text-center">
           
            <p class="text-muted">You are about to login using your <strong>{{ account.get_provider.name }}</strong> account.</p>

            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-dark w-100">
                    <i class="fab fa-github fa-lg me-2"></i> Continue with GitHub
                </button>
            </form>

            <hr>
            <a href="{% url 'account_login' %}" class="btn btn-secondary w-100">
                <i class="fas fa-arrow-left me-2"></i> Back to Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
