
<div id="cookie-banner" class="cookie-banner">
  <div class="cookie-banner__inner">
    <p>We use cookies for analytics to improve your experience.</p>
    <div class="cookie-banner__actions">
      <button id="cookie-accept" class="cookie-banner__accept">Accept</button>
      <button id="cookie-decline">Decline</button>
    </div>
  </div>
</div>

<script nonce="{{ csp_nonce }}">
  const banner = document.getElementById('cookie-banner');
  const consent = localStorage.getItem('cookie_consent');

  if (consent === 'accepted') {
  loadGA();
} else if (!consent) {
  banner.classList.add('is-visible');
}

document.getElementById('cookie-accept').addEventListener('click', () => {
  localStorage.setItem('cookie_consent', 'accepted');
  banner.classList.remove('is-visible');
  loadGA();
});

document.getElementById('cookie-decline').addEventListener('click', () => {
  localStorage.setItem('cookie_consent', 'declined');
  banner.classList.remove('is-visible');
});

  function loadGA() {
    const nonce = '{{ csp_nonce }}';
    const s = document.createElement('script');
    s.src = 'https://www.googletagmanager.com/gtag/js?id=G-E09TYZS7C5';
    s.async = true;
    s.nonce = nonce;
    document.head.appendChild(s);
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-E09TYZS7C5');
  }
</script>
