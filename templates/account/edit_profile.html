{% extends "base.html" %}
{% load crispy_forms_tags %}
{% load static %}
{% block content %}


<form method="post" enctype="multipart/form-data">
  <h1>Edit Profile</h1>
  {% csrf_token %}
  {{ form|crispy }}
  <button type="submit" class="btn btn-primary">Save Changes</button>
  <a href="{% url 'accounts:profile' user.username %}">Cancel</a>
</form>


{% endblock %}
